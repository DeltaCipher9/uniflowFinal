services:
  - type: web
    name: uniflow
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
    disk:
      name: uniflow-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
