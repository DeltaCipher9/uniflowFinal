<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="UniFlow is a university life operating system for courses, assignments, tests, projects, calendars, notices and study analytics.">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="UniFlow — University Life OS">
  <meta property="og:description" content="Organize courses, assignments, tests, projects and your academic schedule in one place.">
  <title>UniFlow — University Life OS</title>
  <style>
    :root { font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #0f172a; background: #f8fafc; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .card { width: min(760px, 100%); padding: 56px 48px; background: white; border: 1px solid #e2e8f0; border-radius: 28px; box-shadow: 0 20px 60px rgba(15,23,42,.08); text-align: center; }
    .logo { width: 72px; height: 72px; margin: 0 auto 20px; display: grid; place-items: center; border-radius: 20px; background: #eff6ff; font-size: 38px; }
    h1 { margin: 0; font-size: clamp(2.4rem, 7vw, 4.5rem); letter-spacing: -0.06em; }
    .tagline { margin: 12px auto 28px; max-width: 600px; color: #475569; font-size: 1.1rem; line-height: 1.7; }
    .features { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 0 0 32px; }
    .feature { padding: 9px 13px; border-radius: 999px; background: #f1f5f9; color: #334155; font-size: .9rem; }
    .btn { display: inline-block; padding: 13px 22px; border-radius: 12px; background: #2563eb; color: white; text-decoration: none; font-weight: 700; }
    .secondary { display: block; margin-top: 18px; color: #64748b; font-size: .9rem; }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo" aria-hidden="true">🎓</div>
    <h1>UniFlow</h1>
    <p class="tagline">A University Life Operating System for organizing courses, assignments, tests, projects, calendars, notices and study progress.</p>
    <div class="features" aria-label="UniFlow features">
      <span class="feature">📚 Courses</span>
      <span class="feature">✅ Tasks</span>
      <span class="feature">📅 Smart Calendar</span>
      <span class="feature">👥 Projects</span>
      <span class="feature">📈 Analytics</span>
      <span class="feature">✨ Notice & PDF AI</span>
    </div>
    <a class="btn" href="/login.html">Open UniFlow</a>
    <span class="secondary">Sign in or create an account to use your personal dashboard.</span>
  </main>
</body>
</html>
